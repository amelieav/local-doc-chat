name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  retrieval-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - name: Install Ollama and the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          curl -s localhost:11434 >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 &)
          for _ in $(seq 60); do curl -s localhost:11434 >/dev/null && break; sleep 1; done
          ollama pull nomic-embed-text
      - name: Retrieval eval
        run: python -m local_doc_chat.evaluation --min-hit-rate 0.9 --min-mrr 0.9 | tee -a "$GITHUB_STEP_SUMMARY"
